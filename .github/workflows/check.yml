name: Sohail checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # This repository has no package-lock.json. Do not change this to npm ci
      # without first generating and committing an appropriate lock file.
      - name: Install declared dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run application and regression tests
        run: npm test
      - name: Verify complete files, local assets and function count
        run: npm run verify
